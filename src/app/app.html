<mat-toolbar class="topbar">
  <a class="brand" routerLink="/" aria-label="Aurora Store, página inicial"
    ><span class="brand-mark">A</span><span>AURORA<span class="brand-dot">.</span></span></a
  >
  <span class="toolbar-spacer"></span>
  <button mat-button class="nav-orders" routerLink="/orders" aria-label="Abrir lista de pedidos">
    <span>Meus Pedidos</span>
  </button>
  <button
    mat-icon-button
    routerLink="/cart"
    [matBadge]="cart.count()"
    matBadgeColor="warn"
    aria-label="Abrir carrinho"
  >
    <mat-icon>shopping_bag</mat-icon>
  </button>
  <button mat-icon-button routerLink="/profile" aria-label="Abrir perfil">
    <mat-icon>person_outline</mat-icon>
  </button>
</mat-toolbar>
<router-outlet></router-outlet>
<footer>
  <div class="container">
    <span class="brand">AURORA<span class="brand-dot">.</span></span
    ><span>Escolhas para viver melhor.</span><span>© 2026 Aurora Store</span>
  </div>
</footer>
